<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Companion</title>
<style>
:root { --bg: #12161a; --panel: #1c2228; --panel2: #262e35; --line: #323b43; --ink: #e8ecef; --muted: #98a3ab; --acc: #f4b63a; --good: #8fd45a; --bad: #ff8e80; --blue: #7cc4f0; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
[hidden] { display: none !important }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; padding-top: env(safe-area-inset-top, 0px) }
header { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: #1a2026; border-bottom: 1px solid #0c0f12 }
header h1 { margin: 0; flex: 1; font-size: 16px; letter-spacing: .04em }
header h1 span { color: var(--acc) }
main { overflow: auto; padding: 12px 14px 24px }
nav.tabs { display: flex; background: #1a2026; border-top: 1px solid #0c0f12; padding-bottom: env(safe-area-inset-bottom, 0px) }
nav.tabs button { flex: 1; padding: 12px 4px 13px; background: none; border: 0; color: var(--muted); font-weight: 600; font-size: 13px; display: grid; justify-items: center; gap: 2px }
nav.tabs button .ic { font-size: 19px; line-height: 1 }
nav.tabs button[aria-selected=true] { color: var(--acc) }
.btn { padding: 9px 14px; border-radius: 8px; border: 1px solid #0c0f12; background: var(--panel2); font-weight: 600 }
.btn.primary { background: var(--acc); color: #1a1406; border-color: #8a6414; width: 100%; padding: 14px; font-size: 16px }
.btn.small { padding: 6px 10px; font-size: 13px }
.btn:disabled { opacity: .5 }
.card { background: var(--panel); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line) }
.card h3 { margin: 0 0 10px; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted) }
.note { color: var(--muted); font-size: 13px }
.warn { color: var(--bad) } .good { color: var(--good) }
label.f { display: grid; gap: 5px; margin-bottom: 12px; font-size: 13px; color: var(--muted) }
select, input[type=number], input[type=text] { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--line); background: #0d1013; color: var(--ink); font-size: 15px }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 12px }
.seg button { flex: 1; padding: 10px 6px; background: var(--panel2); border: 0; color: var(--muted); font-weight: 600 }
.seg button[aria-pressed=true] { background: var(--acc); color: #1a1406 }
.prog { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin: 12px 0 6px } .prog i { display: block; height: 100%; background: var(--acc); width: 0; transition: width .3s }
.mlist { display: grid; gap: 8px }
.mi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: left; width: 100% }
.mi b { display: block; font-size: 15.5px } .mi .note { margin-top: 2px }
.pill { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); white-space: nowrap }
.pill.done { background: #26401c; color: var(--good) }
.verdict { padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid } .verdict b { display: block; font-size: 16px }
.verdict.ok { background: #1d2c18; border-color: #3f6a26 } .verdict.bad { background: #331e1c; border-color: #7a3a33 }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px } .stats > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px } .stats .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em } .stats .v { font-size: 17px; font-weight: 700 }
canvas#view { width: 100%; height: 300px; display: block; border-radius: 12px; background: radial-gradient(#22303a, #0d1115); margin-bottom: 12px; touch-action: none }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px }
.opt { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 7px; display: grid; gap: 2px; text-align: left; font-size: 12px; color: var(--muted) } .opt b { font-size: 14px; color: var(--ink) }
.opt[aria-pressed=true] { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset }
ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 7px } ol.steps b { font-weight: 650 }
table.ks { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums } .ks th, .ks td { padding: 6px 5px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: top } .ks th:nth-child(2), .ks td:nth-child(2) { text-align: left } .ks th:first-child, .ks td:first-child { text-align: center } .ks th { color: var(--muted); font-weight: 500 }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px } .checks .ok { color: var(--good) } .checks .no { color: var(--bad) }
details.more summary { cursor: pointer; color: var(--muted); padding: 4px 0 }
/* flight plan */
.next { position: sticky; top: -12px; z-index: 2; background: #2a2412; border: 1px solid #6a5420; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px }
.next .lab { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc) } .next b { display: block; font-size: 19px; margin: 2px 0 4px }
.ph { margin: 16px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; text-align: left; width: 100% }
.step .bx { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800 }
.step.done { opacity: .55 } .step.done .bx { background: var(--good); border-color: var(--good); color: #102008 }
.step.cur { border-color: var(--acc) }
.step b { font-size: 16.5px; display: block } .step .d { font-size: 14.5px; margin-top: 3px }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px } .tag { font-size: 12px; padding: 2px 8px; border-radius: 9px; background: var(--panel2) } .tag.dv { background: #233645; color: var(--blue) } .tag.st { background: #3a2f12; color: var(--acc) }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px } .res .k { color: var(--muted) } .res .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums }
.tlist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px } .tlist button { text-align: left; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line) } .tlist b { display: block } .tlist span { font-size: 12px; color: var(--muted) }
.stg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px }
/* career */
.bld { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) } .bld:last-child { border: 0 }
.lv { display: flex; gap: 4px } .lv button { width: 38px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); font-weight: 700 } .lv button[aria-pressed=true] { background: var(--acc); color: #1a1406 }
.tier h4 { margin: 14px 0 6px; font-size: 12.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase }
.node { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 9px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 5px }
.node.on { border-color: #3f6a26; background: #1d2918 } .node input { width: 20px; height: 20px; margin: 2px 0 0 } .node .t { font-weight: 650 } .node .pp { font-size: 12px; color: var(--muted) } .node .c { font-size: 12px; color: var(--muted) }
.toast { position: fixed; left: 14px; right: 14px; bottom: 80px; background: #2b333a; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; z-index: 9 }
</style>
</head>
<body>
<div class="app">
  <header><h1>Mission <span>Companion</span></h1><button class="btn small" id="btnUpd" type="button" hidden>Updates</button></header>
  <main id="main">
    <section id="v-missions"></section>
    <section id="v-new" hidden></section>
    <section id="v-mission" hidden></section>
    <section id="v-tools" hidden></section>
    <section id="v-career" hidden></section>
  </main>
  <nav class="tabs" role="tablist"><button data-go="missions" aria-selected="true"><span class="ic">☰</span>Missions</button><button data-go="new"><span class="ic">＋</span>New mission</button><button data-go="tools"><span class="ic">∑</span>Tools</button><button data-go="career"><span class="ic">⚙</span>Career</button></nav>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Stock KSP 1.12 parts used by the optimizer.

   Command pods, Reaction wheel pages); Isp from the wiki's sea-level / vacuum thrust ratio. Sizes in metres
   ('mk2', 'mk3' for spaceplane profiles, 'r' for radially mounted). h: length for the picture. a: marked approximate. */
(function (root) {
const P = [];
const add = (cat, id, t, o) => P.push(Object.assign({ cat, id, t }, o));
// command
const cmd = (id, t, m, c, d, h, o = {}) => add('Command', id, t, Object.assign({ m, dry: m, $: c, d, h, cmd: true }, o));
cmd('mk1pod', 'Mk1 Command Pod', 0.84, 600, 1.25, 1.1, { crew: 1, top: 0.625 });

cmd('mk2drone', 'MK2 Drone Core', 0.2, 2700, 'mk2', 0.8, { probe: true, plane: true });
// fuel tanks: full mass, dry mass, liquid fuel, oxidizer
const tank = (id, t, m, dry, lf, ox, c, d, h, o = {}) => add('Fuel tanks', id, t, Object.assign({ m, dry, lf, ox, $: c, d, h }, o));
tank('oscarB', 'Oscar-B Fuel Tank', 0.225, 0.025, 18, 22, 70, 0.625, 0.4);

tank('jumbo64', 'Rockomax Jumbo-64 Fuel Tank', 36, 4, 2880, 3520, 5750, 2.5, 7.5);
tank('s3-3600', 'Kerbodyne S3-3600 Tank', 20.25, 2.25, 1620, 1980, 3250, 3.75, 1.875);

tank('mk2lfoS', 'Mk2 Rocket Fuel Fuselage Short', 2.29, 0.29, 180, 220, 750, 'mk2', 1.875, { lift: 0.2 });

tank('mk0lf', 'Mk0 Liquid Fuel Fuselage', 0.275, 0.025, 50, 0, 200, 0.625, 1.875);

tank('mk3lfS', 'Mk3 Liquid Fuel Fuselage Short', 14.29, 1.79, 2500, 0, 4300, 'mk3', 2.5);
tank('mk3lf', 'Mk3 Liquid Fuel Fuselage', 28.57, 3.57, 5000, 0, 8600, 'mk3', 5);
tank('mk3lfL', 'Mk3 Liquid Fuel Fuselage Long', 57.14, 7.14, 10000, 0, 17200, 'mk3', 10);
tank('ncs', 'NCS Adapter', 0.5, 0.1, 80, 0, 320, 1.25, 1.2, { d2: 0.625, nose: true });

const eng = (id, t, m, c, ta, tv, ia, iv, d, h, o = {}) => add('Engines', id, t, Object.assign({ m, dry: m, $: c, ta, tv, ia, iv, d, h, fuel: 'LFO' }, o));

eng('rapier', 'CR-7 R.A.P.I.E.R.', 2, 6000, 162.3, 180, 275, 305, 1.25, 2.2, { jet: { t: 105, isp: 3200, vel: [[0, 1], [1, 1.6], [2, 2.6], [3, 3.7], [3.75, 4.43], [4.5, 3], [5.5, 0]] } });
// solid boosters: full / dry mass, built-in solid fuel
const srb = (id, t, m, dry, c, ta, tv, ia, iv, d, h) => add('Engines', id, t, { m, dry, $: c, ta, tv, ia, iv, d, h, fuel: 'SF', srb: true });

const intake = (id, t, m, c, a, sup, d, h, o = {}) => add('Aerodynamics', id, t, Object.assign({ m, dry: m, $: c, intake: { a, sup }, d, h }, o));
intake('circular', 'Circular Intake', 0.01, 280, 0.008, 0, 1.25, 0.3, { nose: true });

intake('xmg50', 'XM-G50 Radial Air Intake', 0.02, 250, 0.003, 0, 'r', 0.7);
intake('dsi', 'Mk1 Diverterless Supersonic Intake', 1.17, 720, 0.006, 1, 1.25, 1.875, { dry: 0.17, lf: 200, ox: 0 });

    const ns = TECH.filter(n => n[1] === tier).map(n => TBY[n[0]]).filter(n => st.fullTree || set.has(n.name) || reqMet(n, set)); if (!ns.length) continue;
    h += `<div class="tier"><h4>Tier ${tier} · ${fmt(ns[0].cost)} science</h4>`;
    for (const n of ns) { const on = set.has(n.name), pp = PARTS.filter(p => p.tech === n.name && !(p.mod && st.mods[p.mod] === false)); h += `<label class="node ${on ? 'on' : ''}"><input type="checkbox" data-node="${esc(n.name)}" ${on ? 'checked' : ''} ${n.name === 'Start' ? 'disabled' : ''}><div style="min-width:0"><div class="t">${esc(n.name)}</div><div class="pp">${pp.length ? esc(pp.map(p => p.t).join(', ')) : 'No rocket parts'}</div>${n.cost > cap && !on ? `<div class="pp warn">Needs R&amp;D level ${n.cost > 500 ? 3 : 2}</div>` : ''}</div><div class="c">${fmt(n.cost)}</div></label>`; }
    h += '</div>';
  }
  h += `<div class="card"><h3>Installed mods and DLC</h3>${[['mh', 'Making History'], ['nfc', 'Near Future Construction'], ['kpbs', 'Planetary Base Systems'], ['kas', 'Kerbal Attachment System']].map(([k, n]) => `<label class="node" style="grid-template-columns:26px 1fr"><input type="checkbox" data-mod="${k}" ${st.mods[k] !== false ? 'checked' : ''}><div class="t">${n}</div></label>`).join('')}</div>`;
  $('v-career').innerHTML = h;
}
$('v-career').addEventListener('click', e => { const b = e.target.closest('[data-bld]'); if (b) { st.career[b.dataset.bld] = +b.dataset.lv; save(); renderCareer(); return; } const p = e.target.closest('[data-preset]'); if (p) { if (p.dataset.preset === 'tree') st.fullTree = !st.fullTree; else st.career.nodes = p.dataset.preset === 'all' ? TECH.map(n => n[0]) : ['Start']; save(); renderCareer(); } });
$('v-career').addEventListener('change', e => { if (e.target.id === 'upTier' && e.target.value) { st.career.nodes = TECH.filter(n => n[1] <= +e.target.value).map(n => n[0]); save(); renderCareer(); return; } const n = e.target.closest('[data-node]'); if (n) { const set = unlocked(); if (n.checked) addNode(n.dataset.node, set); else dropNode(n.dataset.node, set); st.career.nodes = [...set]; save(); renderCareer(); return; } const md = e.target.closest('[data-mod]'); if (md) { st.mods[md.dataset.mod] = md.checked; save(); renderCareer(); } });

// ---- Android app bridge (self-updating shell)
const AB = window.AndroidBridge || null;
st.tools = st.tools || { v: {} };
window.__appUpdate = (v, n) => { toast(`Update ${v} downloaded${n ? ': ' + n : ''}. Reloading…`, 3000); setTimeout(() => AB && AB.reload(), 1500); };
window.__appApkUpdate = (url, n) => { if (confirm(`A new version of the app is available${n ? ': ' + n : ''}. Download it?`)) AB && AB.openUrl(url); };
window.__appUpToDate = v => toast(v < 0 ? "Couldn't reach the update server." : 'You have the latest version.');
window.__appSaved = (ok, msg) => toast(msg || (ok ? 'Saved.' : 'Not saved.'));
window.__appBack = () => { if (st.view === 'tools' && st.tools.cur) { st.tools.cur = null; save(); renderTools(); return true; } if (st.view === 'mission') { go('missions'); return true; } if (st.view !== 'missions') { go('missions'); return true; } return false; };
if (AB && AB.checkNow) { $('btnUpd').hidden = false; $('btnUpd').onclick = () => { AB.checkNow(); toast('Checking for updates…'); }; }
go(st.missions.length || st.career.nodes.length > 1 ? (st.view === 'mission' && st.open ? 'mission' : st.view || 'missions') : 'career');
if (!st.missions.length && st.career.nodes.length <= 1) toast('Start by ticking the tech you have researched.', 4000);
})();

</script>
